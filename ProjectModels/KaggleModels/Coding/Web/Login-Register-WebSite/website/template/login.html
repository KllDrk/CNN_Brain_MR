{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<form method="POST">
  <h3 align="center">Giriş Ekranı</h3>
  <div class="form-group">
    <label for="email">Mail Adresi</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Mail Adresi Girin"
    />
  </div>
  <div class="form-group">
    <label for="password">Şifre</label>
    <input
      type="password"
      class="form-control"
      id="password"
      name="password"
      placeholder="Parola Girin"
    />
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Giriş</button>
</form>
{% endblock %}
