{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<form method="POST">
  <h3 align="center">Kayıt Ekranı</h3>
  <div class="form-group">
    <label for="email">Mail Adresi</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Mail Adresi Girin"
    />
  </div>
  <div class="form-group">
    <label for="firstName">İsim</label>
    <input
      type="text"
      class="form-control"
      id="firstName"
      name="firstName"
      placeholder="İsim Girin"
    />
  </div>
  <div class="form-group">
    <label for="password1">Şifre</label>
    <input
      type="password"
      class="form-control"
      id="password1"
      name="password1"
      placeholder="Parola Girin"
    />
  </div>
  <div class="form-group">
    <label for="password2">Şifre(Tekrar)</label>
    <input
      type="password"
      class="form-control"
      id="password2"
      name="password2"
      placeholder="Parola Girin"
    />
  </div>
  <br />
  <button type="submit" class="btn btn-primary">Kayıt Ol</button>
</form>
{% endblock %}
